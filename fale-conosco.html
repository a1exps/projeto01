<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contato</title>
  <!-- Incluir biblioteca CDN Tailwind CSS -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- Incluir biblioteca CDN Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
</head>

<body class="bg-blue-100">
  <div class="w-full mx-auto container bg-white">
    <!-- Início do cabecalho -->
    <div class="w-full p-2 flex">
      <div class="w-3/12">
        <img src="imagens/logotipo.png" alt="Logotipo" class="w-70" />
      </div>
      <div class="w-9/12">
        <div class="w-full h-full flex justify-end items-center gap-5 pr-5">
          <div>
            <a class="p-5 rounded-xl hover:bg-black hover:text-white transition duration-300"
              href="./index.html">Home</a>
          </div>
          <div>
            <a class="p-5 rounded-xl hover:bg-black hover:text-white transition duration-300"
              href="./quem-somos.html">Quem somos</a>
          </div>
          <div>
            <a class="p-5 rounded-xl hover:bg-black hover:text-white transition duration-300"
              href="./fale-conosco.html">Fale conosco</a>
          </div>
        </div>
      </div>
    </div>
    <!-- Fim do cabeçalho -->

    <!-- Início conteúdo -->
    <div class="w-full flex flex-col">
      <div class="w-full flex p-2 gap-2">
        <div class="w-1/3 bg-gray-900 text-white rounded-lg">
          <h2 class="text-3xl text-left font-bold pl-2 pb-4">Contato</h2>
          <p class="text-justify text-base/5 p-2">
            <i class="bi bi-telephone"></i> Telefone: (12) 3636-2222
          </p>
          <p class="text-justify text-base/5 p-2">
            <i class="bi bi-whatsapp"></i> Whatsapp: (12) 99123-3455
          </p>
          <p class="text-justify text-base/5 p-2">
            <i class="bi bi-envelope"></i> airbus360@site.com.br
          </p>
          <p class="text-justify text-base/5 p-2">
            <i class="bi bi-geo-alt"></i> Avenida Charles Schneider, 1700 -
            Taubaté - SP
          </p>
        </div>
        <!--  -->
        <div class="w-2/3 flex flex-col gap-2">
          <h2 class="text-3xl text-left font-bold pl-2 pb-4">Fale conosco</h2>
          <div class="w-full flex gap-4 p-4">
            <form class="w-full">
              <div class="w-3/4 mb-4 flex items-center gap-2">
                <label class="min-w-24 text-gray-700 font-bold">Nome: </label>
                <input type="text" class="w-full p-2 border border-gray-300 rounded-lg" placeholder="Digite seu nome" />
              </div>
              <!--  -->
              <div class="w-3/4 flex gap-4">
                <div class="w-full mb-4 flex items-center gap-2">
                  <label class="min-w-24 text-gray-700 font-bold">Telefone: </label>
                  <input type="text" class="w-full p-2 border border-gray-300 rounded-lg"
                    placeholder="Digite seu telefone">
                </div>
                <div class="w-full mb-4 flex items-center gap-2">
                  <label class="min-w-24 text-gray-700 font-bold">E-mail: </label>
                  <input type="email" class="w-full p-2 border border-gray-300 rounded-lg"
                    placeholder="Digite seu E-mail">
                </div>
              </div>
              <!--  -->
              <div class="w-3/4 mb-4 flex flex-col justify-center items-start gap-2">
                <label class="min-w-24 text-gray-700 font-bold">Mensagem: </label>
                <textarea rows="5" class="w-full p-2 border border-gray-300 rounded-lg"
                  placeholder="Digite sua mensagem"></textarea>
              </div>

              <div class="w-full">
                <button
                  class="bg-[#0b1f57] text-white py-2 px-4 rounded-lg hover:bg-gray-500 hover:cursor-pointer transition duration-300">Enviar
                  <i class="bi bi-send"></i></button>
              </div>
            </form>
          </div>
        </div>
      </div>
      <!-- início bloco Mapa -->
      <div class="w-full p-4 flex flex-col gap-4">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3672.0263588658395!2d-45.584418324012645!3d-23.022804379173692!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94ccf85d8a0bc64f%3A0xc44c9f9a730b7e6b!2sAv.%20Charles%20Schnneider%2C%201700%20-%20Parque%20Sr.%20do%20Bonfim%2C%20Taubat%C3%A9%20-%20SP%2C%2012050-181!5e0!3m2!1spt-BR!2sbr!4v1779449949269!5m2!1spt-BR!2sbr"
          width="100%" height="450" style="border:0;" allowfullscreen="" loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
      <!-- fim bloco mapa -->
    </div>
    <!-- Fim conteúdo -->

    <!-- Início Rodapé -->
    <div class="w-full flex p-2 flex-col bg-[#0b1f57] text-white text-center">
      <div class="w-full flex">
        <div class="w-1/3">
          <img src="imagens/logotipo.png" alt="Logotipo" class="w-70" />
        </div>
        <div class="w-2/3 flex gap-2 p-5">
          <div class="w-1/2 flex flex-col items-end gap-2">
            <div>
              <a class="p-2 rounded-xl hover:bg-white hover:text-[#0b1f57] transition duration-300"
                href="./index.html">Home</a>
            </div>
            <div>
              <a class="p-2 rounded-xl hover:bg-white hover:text-[#0b1f57] transition duration-300"
                href="./quem-somos.html">Quem somos</a>
            </div>
            <div>
              <a class="p-2 rounded-xl hover:bg-white hover:text-[#0b1f57] transition duration-300"
                href="./fale-conosco.html">Contato</a>
            </div>
          </div>
          <div class="w-1/2 flex flex-col items-end gap-2">
            <div>
              <h4 class="text-lg font-bold">Redes sociais</h4>
            </div>
            <div class="flex gap-2">
              <div>
                <a href=""><i class="bi bi-facebook"></i></a>
              </div>
              <div>
                <a href=""><i class="bi bi-instagram"></i></a>
              </div>
              <div>
                <a href=""><i class="bi bi-youtube"></i></a>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="flex justify-center">
        <p>&copy; 2026 Seu Site. Todos os direitos reservados.</p>
      </div>
    </div>
    <!-- Fim Rodapé -->
  </div>
</body>

</html>
